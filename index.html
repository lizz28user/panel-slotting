    function toDate(value) {
      if (!value) return null;
      if (value instanceof Date) return isNaN(value.getTime()) ? null : value;
      if (typeof value === "string") {
        const matchDMY = value.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
        if (matchDMY) return new Date(matchDMY[3], matchDMY[2] - 1, matchDMY[1]);
        const matchYMD = value.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
        if (matchYMD) return new Date(matchYMD[1], matchYMD[2] - 1, matchYMD[3]);
      }
      const d = new Date(value); return isNaN(d.getTime()) ? null : d;
    }

    function parseExcelDate(val) {
      if (!val && val !== 0) return dateKey();
      if (typeof val === 'number' && window.XLSX) {
        const d = window.XLSX.SSF.parse_date_code(val);
        if (d) return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`;
      }
      const str = String(val).trim();
      const matchDMY = str.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
      if (matchDMY) return `${matchDMY[3]}-${matchDMY[2].padStart(2, '0')}-${matchDMY[1].padStart(2, '0')}`;
      const matchYMD = str.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
      if (matchYMD) return `${matchYMD[1]}-${matchYMD[2].padStart(2, '0')}-${matchYMD[3].padStart(2, '0')}`;
      const parsed = new Date(str);
      return !isNaN(parsed.getTime()) ? dateKey(parsed) : dateKey();
    }

    function dateKey(value = new Date()) {
      if (typeof value === "string" && /^\d{4}-\d{2}-\d{2}$/.test(value)) return value;
      const d = toDate(value) || new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    }

    function formatDate(value) {
      const d = toDate(value);
      return d ? d.toLocaleDateString("es-PE", { day: "2-digit", month: "2-digit", year: "numeric" }) : "—";
    }

    function getWeekRange(date = new Date()) {
      const d = new Date(date);
      const day = d.getDay() === 0 ? 7 : d.getDay();
      const diff = d.getDate() - day + 1;
      const start = new Date(d.setDate(diff));
      start.setHours(0,0,0,0);
      const end = new Date(start);
      end.setDate(start.getDate() + 6);
      end.setHours(23,59,59,999);
      return { start, end };
    }

    function uid(prefix) { return `${prefix}-${window.crypto?.randomUUID?.() || Date.now().toString(36) + Math.random().toString(36).slice(2)}`; }
    function hoursAgo(hours) { return new Date(Date.now() - hours * 3600000).toISOString(); }
    
    function elapsedDays(row, now) {
      const start = toDate(row.createdAt);
      if (!start) return 0;
      const end = toDate(row.status === "Resuelta" && row.resolvedAt ? row.resolvedAt : now) || new Date();
      return Math.max(0, Math.round((end - start) / 86400000));
    }
    
    function elapsedText(row, now) {
      const days = elapsedDays(row, now);
      return days === 0 ? "Mismo día" : `${days} día${days === 1 ? "" : "s"}`;
    }

        clipboard: <><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/><path d="M9 14h6M9 18h6M9 10h6"/></>,
        box: <><path d="m12 3 9 5-9 5-9-5 9-5ZM3 8v9l9 5 9-5V8M12 13v9M7.5 5.5l9 5"/></>,
        download: <path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/>,

      return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{paths[name] || paths.box}</svg>;

    function Badge({ status }) {
      const styles = { 
        "Pendiente": "bg-[#F37021]/10 text-[#F37021] border border-[#F37021]/20 shadow-[0_0_10px_rgba(243,112,33,0.1)]",

    }

    function GaugeCard({ label, value, max, color, icon }) {
      const radius = 50; const circumference = Math.PI * radius;
      const percent = max > 0 ? Math.min(1, value / max) : 0;
      const strokeDashoffset = circumference - (percent * circumference);
      
      const glowColor = color === "#E3001B" ? "rgba(227, 0, 27, 0.4)" : 
                        color === "#009640" ? "rgba(0, 150, 64, 0.4)" : 
                        color === "#F37021" ? "rgba(243, 112, 33, 0.4)" : "rgba(255, 255, 255, 0.2)";

      return (
        <article className="glass-panel p-5 flex flex-col items-center relative overflow-hidden group hover:border-white/20 transition-all duration-300">
          <div className="absolute top-0 left-0 w-full h-1" style={{ backgroundColor: color, boxShadow: `0 0 15px ${color}` }}></div>

            <span className="w-8 h-8 rounded-lg flex items-center justify-center text-sm font-bold text-white transition-transform group-hover:scale-110" style={{ backgroundColor: color, boxShadow: `0 0 15px ${glowColor}` }}>{icon}</span>
            <p className="text-sm font-semibold text-[var(--text-muted)]">{label}</p>
          </div>
          <div className="relative w-40 h-20 flex items-end justify-center mt-2">
            <svg viewBox="0 0 120 70" className="w-full h-full drop-shadow-lg">
              <path d="M 10 60 A 50 50 0 0 1 110 60" fill="none" stroke="var(--table-border)" strokeWidth="14" strokeLinecap="round"/>
              <path d="M 10 60 A 50 50 0 0 1 110 60" fill="none" stroke={color} strokeWidth="14" strokeLinecap="round" strokeDasharray={circumference} strokeDashoffset={strokeDashoffset} className="transition-all duration-1000 ease-out" style={{ filter: `drop-shadow(0 0 6px ${glowColor})` }}/>
            </svg>
            <div className="absolute bottom-0 flex flex-col items-center"><span className="text-4xl font-black text-[var(--text-main)]" style={{ textShadow: `0 0 20px ${glowColor}` }}>{value}</span></div>
          </div>
          <p className="text-[10px] text-[var(--text-muted)] mt-3 font-bold uppercase tracking-widest">Registros</p>
        </article>
      );
    }

    function ExecutiveSummary({ summary }) {
      const chartRef = useRef(null);

      useEffect(() => {
        if (!window.Chart || !chartRef.current) return;
        if (Chart.getChart(chartRef.current)) Chart.getChart(chartRef.current).destroy();
        
        const gridColor = getComputedStyle(document.documentElement).getPropertyValue('--table-border').trim();
        const textColor = getComputedStyle(document.documentElement).getPropertyValue('--text-muted').trim();
        
        Chart.defaults.color = textColor;
        Chart.defaults.font.family = "'Outfit', sans-serif";
        Chart.defaults.font.size = 12;
        
        const chart = new Chart(chartRef.current.getContext('2d'), {
          type: 'bar',
          data: {
            labels: summary.areas.map(a => a.name),
            datasets: [
              { label: 'Pendiente', data: summary.areas.map(a => a.pendientes), backgroundColor: '#F37021', borderRadius: 4, borderWidth: 0 },
              { label: 'En Proceso', data: summary.areas.map(a => a.proceso), backgroundColor: '#3B82F6', borderRadius: 4, borderWidth: 0 },
              { label: 'Resuelta', data: summary.areas.map(a => a.resueltas), backgroundColor: '#009640', borderRadius: 4, borderWidth: 0 }
            ]
          },
          options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { position: 'bottom', labels: { usePointStyle: true, padding: 15, font: { size: 12, weight: '600' } } } },

    function supplierKey(value) {
      return String(value ?? "").trim().replace(/\s+/g, " ").toLocaleUpperCase("es-PE");
    }

    function historicalMetrics(dashboardHistory) {
      const { start, end } = getWeekRange();
      
      const reports = Object.values(dashboardHistory || {})
        .filter(r => r && typeof r === "object")
        .filter(r => {
          if (!r.fecha) return false;
          const reportDate = toDate(r.fecha);
          if (!reportDate) return false;
          return reportDate >= start && reportDate <= end;
        });

      const numeric = value => Number.isFinite(Number(value)) ? Math.max(0, Number(value)) : 0;
      const providers = new Map();
      let totalCitas = 0, totalLpns = 0;
      
      const overThreeByDay = [];

      reports.forEach(report => {
        totalCitas += numeric(report.totalCitas);
        totalLpns += numeric(report.totalLpns);
        const ranking = Array.isArray(report.rankingCompleto) ? report.rankingCompleto : (Array.isArray(report.ranking) ? report.ranking : []);
        
        const dailyOverThree = [];

        ranking.forEach(row => {
          const key = supplierKey(row?.proveedor);
          if (!key) return;
          
          const citas = numeric(row.citas);
          const current = providers.get(key) || { proveedor: String(row.proveedor).trim(), citas: 0 };
          current.citas += citas;
          providers.set(key, current);

          if (citas > 3) {
            dailyOverThree.push({ proveedor: String(row.proveedor).trim(), citas });
          }
        });

        if (dailyOverThree.length > 0) {
          overThreeByDay.push({ 
            date: report.fecha, 
            providers: dailyOverThree.sort((a,b) => b.citas - a.citas) 
          });
        }
      });

      overThreeByDay.sort((a, b) => {
        const dateA = toDate(a.date);
        const dateB = toDate(b.date);
        return dateB - dateA;
      });

      const sorted = [...providers.values()].sort((a, b) => b.citas - a.citas);
      const topProvider = sorted[0] || null;

      return {
        totalCitas, totalLpns: Math.round(totalLpns), days: reports.length,
        uniqueProviders: providers.size, topProvider,
        overThreeByDay, 
        ranking: sorted.slice(0, 10)
      };
    }

    function CitasAnalytics({ dashboardHistory }) {
      const rankingRef = useRef(null);

          {!metrics.days ? <p className="py-10 text-center text-[var(--text-muted)] text-sm">No hay reportes guardados esta semana. Carga un Excel en Dashboard de Citas.</p>
            : !metrics.ranking.length ? <p className="py-10 text-center text-[var(--text-muted)] text-sm">Los reportes no contienen datos para el ranking.</p>
            : !window.Chart ? <p className="py-10 text-center text-[var(--text-muted)] text-sm">No se pudo cargar Chart.js.</p>
            : <div className="chart-wrap" style={{ height: Math.max(250, metrics.ranking.length * 35 + 40) }}>

        </section>

        <section className="glass-panel p-5">

          <p className="text-sm text-[var(--text-muted)] mt-1 mb-4">Listado de proveedores que superaron las 3 citas en un día de la <strong>semana actual</strong>.</p>
          
          {!metrics.days ? (

                          {p.citas} citas
                        </span>
                      </div>
                    ))}
                  </div>
                </div>
              ))}
            </div>
          )}
        </section>
      </div>;
    }

    function RecordModal({ modal, onClose, onSave, catalog }) {
      const isPack = modal.view === "packs"; const isMaster = modal.view === "master"; const isCitas = modal.view === "citas";
      const dialog = useRef(null); const [error, setError] = useState("");
      const [form, setForm] = useState(() => {
        if (modal.record) {
          if (isPack) return { ...modal.record, proceeded: modal.record.proceeded || "Sí", status: modal.record.status || "Pendiente" };
          return { ...modal.record, createdAt: dateKey(modal.record.createdAt), appointmentDate: modal.record.appointmentDate || "", resolvedAt: modal.record.resolvedAt ? dateKey(modal.record.resolvedAt) : "" };
        }
        return isPack ? { sku: "", description: "", oldMP: "", newMP: "", date: dateKey(), user: USER, proceeded: "Sí", status: "Resuelta", resolvedAt: dateKey() } 
                      : { createdAt: dateKey(), supplier: "", appointmentDate: dateKey(), reportType: "", description: "", reason: "No generó su cita", observations: "", status: "Pendiente", resolvedAt: "" };
      });

      useEffect(() => { const prev = document.activeElement; const overflow = document.body.style.overflow; document.body.style.overflow = "hidden"; dialog.current.showModal(); return () => { document.body.style.overflow = overflow; prev?.focus?.(); }; }, []);

      // Estado del SKU en el catálogo (solo para master)
      const skuStatus = useMemo(() => {
        if (!isMaster) return null;
        const key = String(form.sku || "").trim().toUpperCase();
        if (!key) return null;
        return catalog[key]
          ? { valid: true, description: catalog[key] }
          : { valid: false };
      }, [isMaster, form.sku, catalog]);

      function change(e) {
        const { name, value } = e.target;
        setForm(prev => {
          const next = { ...prev, [name]: value };
          
          // Autocompletar descripción en master desde el catálogo
          if (isMaster && name === "sku") {
            const key = String(value).trim().toUpperCase();
            next.description = key && catalog[key] ? catalog[key] : "";
          }

          if (isPack) {
            if (name === "proceeded") {
              next.status = value === "Sí" ? "Resuelta" : "Pendiente";
              if (value === "Sí") next.resolvedAt = prev.resolvedAt || dateKey();
            } else if (name === "status") {
              next.proceeded = value === "Resuelta" ? "Sí" : "No";
              next.resolvedAt = value === "Resuelta" ? (prev.resolvedAt || dateKey()) : "";
            }
          } else if (name === "status") {
            next.resolvedAt = value === "Resuelta" ? (prev.resolvedAt || dateKey()) : "";
          }
          return next;
        });
        setError("");
      }

      function submit(e) {
        e.preventDefault();

        // Validación del catálogo antes que nada (solo master)
        if (isMaster) {
          const key = String(form.sku || "").trim().toUpperCase();
          if (!key) return setError("El SKU es obligatorio.");
          if (!catalog[key]) {
            return setError(
              `El SKU "${form.sku}" no existe en el catálogo de productos. ` +
              `Verifica el código o pide al administrador que cargue el catálogo actualizado.`
            );
          }
        }

        const required = isPack ? ["sku", "description", "user"] : isMaster ? ["sku", "description", "reason"] : isCitas ? ["supplier", "appointmentDate", "reportType", "description"] : ["supplier", "reason"];
        if (required.some(k => !String(form[k] || "").trim())) return setError("Completa todos los campos requeridos.");
        const cleaned = { ...form };
        required.forEach(k => cleaned[k] = String(form[k]).trim());

        if (isMaster) {
          cleaned.sku = String(form.sku).trim().toUpperCase();
          cleaned.description = catalog[cleaned.sku]; // Descripción forzada del catálogo
        }

        if (isPack) {
          const oldMP = Number(form.oldMP), newMP = Number(form.newMP);
          if (![oldMP, newMP].every(n => Number.isSafeInteger(n) && n > 0)) return setError("Los valores deben ser enteros positivos.");
          cleaned.oldMP = oldMP; cleaned.newMP = newMP; cleaned.date = dateKey(toDate(form.date)); 
          
          cleaned.proceeded = form.proceeded === "Sí" ? "Sí" : "No";
          cleaned.status = cleaned.proceeded === "Sí" ? "Resuelta" : "Pendiente";
          if (cleaned.status === "Resuelta" && !cleaned.resolvedAt) cleaned.resolvedAt = dateKey();

        } else {
          const today = new Date(); today.setHours(0,0,0,0);
          const created = toDate(form.createdAt);
          if (!created || created > today) return setError("Fecha de registro inválida.");
          cleaned.createdAt = dateKey(created);
          if (isCitas) { cleaned.appointmentDate = dateKey(toDate(form.appointmentDate)); cleaned.reason = ""; }
          cleaned.resolvedAt = null;
          if (form.status === "Resuelta") {
            const res = toDate(form.resolvedAt);
            if (!res || res < created || res > today) return setError("Fecha de resolución inválida.");
            cleaned.resolvedAt = dateKey(res);
          }
        }
        onSave(cleaned);
      }

      function field(label, name, type = "text", extra = {}) { 
        return <label className="block text-sm font-semibold text-[var(--text-dark)] mb-4">{label}<input className="field mt-2" name={name} type={type} value={form[name] ?? ""} onChange={change} required {...extra}/></label>; 
      }

      return <dialog ref={dialog} className="p-0 rounded-2xl shadow-2xl w-[calc(100%-2rem)] max-w-lg" onCancel={e => { e.preventDefault(); onClose(); }} onClick={e => { if (e.target === dialog.current) onClose(); }}>
        <div className="p-5 border-b border-[var(--panel-border)] flex justify-between items-start bg-[var(--table-head-bg)]">
          <div><h2 className="text-xl font-bold text-[var(--text-main)]">{modal.record ? "Editar registro" : isPack ? "Nuevo Cambio" : isCitas ? "Nuevo Reporte" : "Nueva Incidencia"}</h2><p className="text-sm text-[var(--text-muted)] mt-1">{VIEWS[modal.view].title}</p></div>
          <button onClick={onClose} className="text-2xl text-[var(--text-muted)] hover:text-[var(--text-main)] hover:bg-[var(--card-hover)] w-10 h-10 rounded-xl flex items-center justify-center transition">×</button>
        </div>
        <form onSubmit={submit} className="p-5">
          {isPack ? <>
            {field("SKU", "sku", "text", { autoFocus: true })}{field("Descripción", "description")}
            <div className="grid grid-cols-2 gap-4">{field("MP Antiguo", "oldMP", "number", {min:1})}{field("MP Nuevo", "newMP", "number", {min:1})}{field("Fecha de Cambio", "date", "date")}{field("Usuario", "user")}</div>
            <label className="block text-sm font-semibold text-[var(--text-dark)] mb-4">Procedió<select className="field mt-2" name="proceeded" value={form.proceeded} onChange={change}><option>Sí</option><option>No</option></select></label>
            <label className="block text-sm font-semibold text-[var(--text-dark)] mb-4">Estado<select className="field mt-2" name="status" value={form.status} onChange={change}><option>Pendiente</option><option>Resuelta</option></select></label>
          </> : <>
            {field("Fecha de registro", "createdAt", "date", { max: dateKey() })}
            {isMaster ? <>
              <label className="block text-sm font-semibold text-[var(--text-dark)] mb-4">
                SKU
                <div className="relative">
                  <input
                    className="field mt-2 pr-28"
                    name="sku"
                    type="text"
                    value={form.sku ?? ""}
                    onChange={change}
                    required
                    autoFocus
                    placeholder="Ej: 100245"
                  />
                  {skuStatus && (
                    <span className={`absolute right-3 top-1/2 -translate-y-1/2 text-xs font-bold ${skuStatus.valid ? 'text-[#009640]' : 'text-[#E3001B]'}`}>
                      {skuStatus.valid ? '✓ En catálogo' : '✗ No existe'}
                    </span>
                  )}
                </div>
              </label>

              <label className="block text-sm font-semibold text-[var(--text-dark)] mb-4">
                Descripción <span className="text-[10px] text-[var(--text-muted)] font-normal">(auto desde el catálogo)</span>
                <input
                  className="field mt-2"
                  name="description"
                  type="text"
                  value={form.description ?? ""}
                  readOnly
                  placeholder={skuStatus && !skuStatus.valid ? "SKU no encontrado" : "Se autocompletará al escribir el SKU"}
                />
              </label>

              <label className="block text-sm font-semibold text-[var(--text-dark)] mb-4">Motivo<textarea className="field mt-2" rows="3" name="reason" required value={form.reason} onChange={change}/></label>
            </> 
            : isCitas ? <>{field("Proveedor", "supplier", "text", {autoFocus:true})}{field("Fecha de la Cita", "appointmentDate", "date")}{field("Tipo de Reporte", "reportType")}<label className="block text-sm font-semibold text-[var(--text-dark)] mb-4">Descripción<textarea className="field mt-2" rows="3" name="description" required value={form.description} onChange={change}/></label></>
            : <>
                {field("Proveedor", "supplier", "text", {autoFocus:true})}
                <label className="block text-sm font-semibold text-[var(--text-dark)] mb-4">Motivo
                  <select className="field mt-2" name="reason" value={form.reason} onChange={change}>
                    {SUPPLIER_REASONS.map(r => <option key={r} value={r}>{r}</option>)}
                  </select>
                </label>
                <label className="block text-sm font-semibold text-[var(--text-dark)] mb-4">Observaciones
                  <textarea className="field mt-2" rows="3" name="observations" value={form.observations || ""} onChange={change} placeholder="Detalles adicionales (opcional)"/>
                </label>
              </>}
            <label className="block text-sm font-semibold text-[var(--text-dark)] mb-4">Estado<select className="field mt-2" name="status" value={form.status} onChange={change}>{STATES.map(s => <option key={s}>{s}</option>)}</select></label>
            {form.status === "Resuelta" && field("Fecha de resolución", "resolvedAt", "date", { max: dateKey() })}
          </>}
          {error && <p className="bg-[#E3001B]/10 border border-[#E3001B]/20 text-[#E3001B] p-3 rounded-xl text-sm font-semibold">{error}</p>}
          <div className="pt-4 mt-4 border-t border-[var(--panel-border)] flex justify-end gap-3"><button type="button" onClick={onClose} className="px-5 py-2.5 border border-[var(--panel-border)] rounded-xl text-sm text-[var(--text-dark)] font-semibold hover:bg-[var(--card-hover)] transition">Cancelar</button><button type="submit" className="btn-primary px-5 py-2.5 rounded-xl text-sm font-bold">Guardar</button></div>
        </form>
      </dialog>;
    }

    function App() {

      const [importReport, setImportReport] = useState(null); const [storageError, setStorageError] = useState(""); const [now, setNow] = useState(Date.now());
      
      const [theme, setTheme] = useState(localStorage.getItem('slotting_theme') || 'dark');
      const [showThemeMenu, setShowThemeMenu] = useState(false);
      
      const [packDateFilter, setPackDateFilter] = useState("");

      const fileRef = useRef(null); const headerCheckRef = useRef(null);

      function handleSaveHistory(dashData) {

        let parsedDate = toDate(dashData.fecha) || new Date();

          if (!key || existing.has(key)) continue;
          existing.add(key);
          incidents.push({

            reason: "No generó su cita", 
            observations: "",
            status: "Resuelta", resolvedAt: createdAt, 
            evidence: "Cierre automático", closureNote: "Registrado al guardar Dashboard"

      /* ---------- CATÁLOGO: subir / vaciar / exportar ---------- */
      async function handleCatalogUpload(event) {
        const file = event.target.files?.[0];
        event.target.value = "";
        if (!isAdmin) { setNotice("Solo el administrador puede cargar el catálogo."); return; }
        if (!file) return;
        if (!window.XLSX) return setNotice("XLSX no disponible. Revisa tu conexión.");
        try {
          const buffer = await file.arrayBuffer();
          const book = XLSX.read(buffer, { type: "array" });
          const sheet = book.Sheets[book.SheetNames[0]];
          const rawRows = XLSX.utils.sheet_to_json(sheet, { defval: "", raw: false });

          const products = {};
          let skipped = 0;
          rawRows.forEach(row => {
            const sku = String(
              row.SKU ?? row.sku ?? row.Codigo ?? row.codigo ??
              row["Código"] ?? row["Codigo"] ?? row["CODIGO"] ?? row["SKU "] ?? ""
            ).trim().toUpperCase();
            const desc = String(
              row.Descripción ?? row["Descripción"] ?? row.descripcion ??
              row.Description ?? row.Producto ?? row.producto ?? row.Nombre ?? ""
            ).trim();
            if (sku && desc) products[sku] = desc;
            else skipped++;
          });

          const total = Object.keys(products).length;
          if (total === 0) return setNotice("No se detectaron columnas 'SKU' / 'Descripción'.");

          const sizeBytes = new Blob([JSON.stringify(products)]).size;
          if (sizeBytes > 950000) {
            return setNotice(`Catálogo demasiado grande (${Math.round(sizeBytes/1024)} KB). Divídelo en dos archivos.`);
          }

          await db.collection('slotting').doc(DB_DOC_CATALOG).set({
            products,
            total,
            fileName: file.name,
            updatedAt: new Date().toISOString()
          });
          try { localStorage.setItem('slotting_catalogo', JSON.stringify(products)); } catch(e){}
          setCatalog(products);
          setNotice(`Catálogo cargado: ${total.toLocaleString('es-PE')} SKUs (${skipped} filas omitidas).`);
        } catch (err) {
          console.error(err);
          setNotice("Error al procesar el archivo de catálogo.");
        }
      }

      /* ---------- PROCESAR EXCEL DE DASHBOARD ---------- */
      const handleDashboardUpload = async (e) => {
        const file = e.target.files?.[0]; e.target.value = "";
        if (!file) return;
        const XLSX = window.XLSX;
        if (!XLSX || typeof XLSX.read !== "function" || typeof XLSX.utils?.sheet_to_json !== "function") {
          setNotice("No se pudo cargar la librería XLSX. Revisa tu conexión."); return;
        }

        try {
          const buffer = await file.arrayBuffer();
          const book = XLSX.read(buffer, { type: "array" });
          
          let fechaStr = dateKey();
          const matchDMY = file.name.match(/(\d{1,2})[-_/](\d{1,2})[-_/](\d{4})/);
          const matchYMD = file.name.match(/(\d{4})[-_/](\d{1,2})[-_/](\d{1,2})/);
          
          if (matchDMY) {
            fechaStr = `${matchDMY[1].padStart(2, '0')}-${matchDMY[2].padStart(2, '0')}-${matchDMY[3]}`;
          } else if (matchYMD) {
            fechaStr = `${matchYMD[3].padStart(2, '0')}-${matchYMD[2].padStart(2, '0')}-${matchYMD[1]}`;
          }

          const sheet1 = book.Sheets["AGENDA 01"];
          if (!sheet1) throw new Error("No se encontró la hoja AGENDA 01");
          const rows1 = XLSX.utils.sheet_to_json(sheet1, { header: 1, defval: "" });
          
          const sheet2 = book.Sheets["AGENDA  02"] || book.Sheets["AGENDA 02"];
          const rows2 = sheet2 ? XLSX.utils.sheet_to_json(sheet2, { header: 1, defval: "" }) : [];

          let totalLpns = 0, totalProveedores = new Set(), pendientesCount = 0, agendadosCount = 0, pendientesList = [];
          let totalCitas = 0, rankingMap = Object.create(null);

          let colTotalLPN = -1, colCitasHoja1 = -1, colProveedor = 1, colEstado = -1;

          for (let r = 0; r < 10; r++) {
            if (!rows1[r]) continue;
            rows1[r].forEach((cell, idx) => {
              const text = String(cell).trim().toUpperCase();
              if (text === "TOTAL" || text.includes("TOTAL LPN") || text.includes("LPN")) colTotalLPN = idx;
              if (text.includes("CANTIDAD DE CITAS") || text === "CITAS") colCitasHoja1 = idx;
              if (text === "ESTADO") colEstado = idx;
              if (text === "PROVEEDOR" || text === "NOMBRE") colProveedor = idx;
            });
          }
          
          if (colTotalLPN === -1) colTotalLPN = 6; 
          if (colEstado === -1) colEstado = 8;

          for (let i = 4; i < rows1.length; i++) {
            const row = rows1[i];
            if (!row || !row[colProveedor]) continue;
            
            const proveedor = String(row[colProveedor]).trim();
            const estado = colEstado !== -1 ? String(row[colEstado]).trim().toUpperCase() : "";
            const isTotalRow = proveedor.toUpperCase().includes("TOTAL") || String(row[0]).toUpperCase().includes("TOTAL");

            if (proveedor && !isTotalRow) {
              totalProveedores.add(proveedor);
              const lpns = Number(row[colTotalLPN]) || 0;
              if (!isNaN(lpns)) totalLpns += lpns;
              
              if (colCitasHoja1 !== -1) {
                const citas = Number(row[colCitasHoja1]) || 0;
                if (!isNaN(citas)) { totalCitas += citas; rankingMap[proveedor] = (rankingMap[proveedor] || 0) + citas; }
              }

              if (estado === "PENDIENTE") { pendientesCount++; pendientesList.push({ proveedor }); } 
              else if (estado === "AGENDADO") { agendadosCount++; }
            }
          }

          if (colCitasHoja1 === -1 && rows2.length > 0) {
            let colCitasHoja2 = -1, colProvHoja2 = 1;
            for (let r = 0; r < 10; r++) {
              if (!rows2[r]) continue;
              rows2[r].forEach((cell, idx) => {
                const text = String(cell).trim().toUpperCase();
                if (text.includes("CANTIDAD DE CITAS") || text === "CITAS") colCitasHoja2 = idx;
                if (text === "PROVEEDOR" || text === "NOMBRE") colProvHoja2 = idx;
              });
            }
            if (colCitasHoja2 === -1) colCitasHoja2 = 4;

            for (let i = 4; i < rows2.length; i++) {
              const row = rows2[i];
              if (!row || !row[colProvHoja2]) continue;
              const proveedor = String(row[colProvHoja2]).trim();
              const isTotalRow = proveedor.toUpperCase().includes("TOTAL") || String(row[0]).toUpperCase().includes("TOTAL");
              if (!isTotalRow && proveedor) {
                const citas = Number(row[colCitasHoja2]) || 0;
                if (!isNaN(citas)) { totalCitas += citas; rankingMap[proveedor] = (rankingMap[proveedor] || 0) + citas; }
              }
            }
          }

          const rankingCompleto = Object.keys(rankingMap).map(prov => ({ proveedor: prov, citas: rankingMap[prov] })).sort((a, b) => b.citas - a.citas);
          const ranking = rankingCompleto.slice(0, 10);

          setDashboardData({
            fecha: fechaStr, totalLpns, totalProveedores: totalProveedores.size, totalCitas, pendientesCount, pendientesList, ranking, rankingCompleto,
            atendidos: { agendados: agendadosCount, pendientes: pendientesCount }
          });
          setNotice("Dashboard generado correctamente.");
        } catch (error) {
          console.error(error);
          setNotice("Error al procesar el Excel. Verifica el formato.");
        }
      };

      function downloadTemplate() {

        const sheet = XLSX.utils.aoa_to_sheet([["SKU", "Descripción", "MP Antiguo", "MP Nuevo", "Fecha de Cambio", "Usuario", "Procedió"]]);

      async function importFile(event) {
        const file = event.target.files?.[0]; event.target.value = ""; if (!file || !window.XLSX) return;
        try {
          const buffer = await file.arrayBuffer(); const book = XLSX.read(buffer, { type: "array" });
          const sheet = book.Sheets["Master Pack"] || book.Sheets[book.SheetNames[0]];
          
          const rawRows = XLSX.utils.sheet_to_json(sheet, { defval: "", raw: true });
          const added = []; const errors = [];
          
          rawRows.forEach((raw, idx) => {
            const getVal = (aliases) => { 
              for (let a of aliases) {
                if (raw[a] !== undefined) return raw[a];
                const key = Object.keys(raw).find(k => k.trim().toLowerCase() === a.trim().toLowerCase());
                if (key) return raw[key];
              }
              return ""; 
            };
            
            const sku = String(getVal(["SKU", "sku", "Codigo"])).trim();
            const desc = String(getVal(["Descripción", "descripcion", "Producto"])).trim();
            const oldMP = Number(getVal(["MP Antiguo", "mp antiguo"]));
            const newMP = Number(getVal(["MP Nuevo", "mp nuevo"]));
            const dateVal = getVal(["Fecha de Cambio", "Fecha", "fecha"]);
            const user = String(getVal(["Usuario", "user"])).trim() || USER;
            
            const rawProc = String(getVal(["Procedió", "procedio", "Procedio"])).trim().toLowerCase();
            const isResolved = rawProc === "sí" || rawProc === "si" || rawProc === "s";

            if (sku && desc && !isNaN(oldMP) && !isNaN(newMP)) {
              const finalDate = parseExcelDate(dateVal);
              
              added.push({ 
                id: uid("MP"), sku, description: desc, oldMP, newMP, 
                date: finalDate, 
                user, 
                proceeded: isResolved ? "Sí" : "No",
                status: isResolved ? "Resuelta" : "Pendiente",
                resolvedAt: isResolved ? finalDate : null
              });
            } else { errors.push(`Fila ${idx + 2}: datos incompletos.`); }
          });
          
          if (added.length) {
            setData(prev => ({ ...prev, packs: [...added, ...prev.packs] }));
            setExcelHistory(prev => [{ id: uid("EH"), fileName: file.name, date: new Date().toISOString(), count: added.length }, ...prev].slice(0, 10));
          }
          setImportReport({ added: added.length, errors }); 
          setNotice(`Importación: ${added.length} agregados.`);
        } catch (e) { 
          console.error(e);
          setNotice("Error al leer archivo."); 
        }
      }

      // --- KPI CALCULATIONS ---
      const pending = rows.filter(r => r.status === "Pendiente").length;
      const processing = rows.filter(r => r.status === "En Proceso").length;
      const resolvedToday = rows.filter(r => r.status === "Resuelta" && r.resolvedAt && dateKey(r.resolvedAt) === currentDay).length;
      const critical = rows.filter(r => r.status !== "Resuelta" && elapsedDays(r, now) >= 1).length;

      const totalPacks = rows.length;
      const packsToday = rows.filter(r => r.date === currentDay).length;
      const uniqueSkus = new Set(rows.map(r => r.sku)).size;

      const kpis = isPack ? [
        { label: "Pendientes", value: rows.filter(r => r.status === "Pendiente").length, color: "#F37021", icon: "◷" },
        { label: "Resueltos", value: rows.filter(r => r.status === "Resuelta").length, color: "#009640", icon: "✓" },
        { label: "SKUs Modificados", value: uniqueSkus, color: "#3B82F6", icon: "#" }
      ] : view === "suppliers" ? [
        { label: "No subió su cita", value: rows.filter(r => r.reason.includes("No generó")).length, color: "#F37021", icon: "◷" },
        { label: "Cita tardía", value: rows.filter(r => r.reason.includes("tardía")).length, color: "#E3001B", icon: "!" },
        { label: "Por límite cubierto", value: rows.filter(r => r.reason.includes("límite")).length, color: "#3B82F6", icon: "↻" }
      ] : [
        { label: "Pendientes", value: pending, color: "#F37021", icon: "◷" },
        { label: "En Proceso", value: processing, color: "#3B82F6", icon: "↻" },
        (view === "master" || view === "citas")
          ? { label: "Resueltas Hoy", value: resolvedToday, color: "#009640", icon: "✓" }
          : { label: "Críticas +1 día", value: critical, color: "#E3001B", icon: "!" }
      ];
      const maxKpi = Math.max(...kpis.map(k => k.value), 1);

      // --- RESUMEN EJECUTIVO ---
      const allOps = [...data.master, ...data.suppliers, ...data.citas];
      const byStatus = (list, s) => list.filter(r => r.status === s).length;
      const executiveSummary = {
        pending: byStatus(allOps, "Pendiente"),
        processing: byStatus(allOps, "En Proceso"),
        resolvedToday: allOps.filter(r => r.status === "Resuelta" && r.resolvedAt && dateKey(r.resolvedAt) === currentDay).length,
        critical: data.suppliers.filter(r => r.status !== "Resuelta" && elapsedDays(r, now) >= 1).length,
        packsToday: data.packs.filter(r => r.date === currentDay).length,
        totalPacks: data.packs.length,
        areas: [
          { name: "Datos Maestros", pendientes: byStatus(data.master, "Pendiente"), proceso: byStatus(data.master, "En Proceso"), resueltas: byStatus(data.master, "Resuelta") },
          { name: "Proveedores", pendientes: byStatus(data.suppliers, "Pendiente"), proceso: byStatus(data.suppliers, "En Proceso"), resueltas: byStatus(data.suppliers, "Resuelta") },
          { name: "Citas", pendientes: byStatus(data.citas, "Pendiente"), proceso: byStatus(data.citas, "En Proceso"), resueltas: byStatus(data.citas, "Resuelta") }
        ]
      };

      return <div className="min-h-screen font-sans text-[var(--text-main)] selection:bg-[#E3001B] selection:text-white">
        {/* HEADER */}
        <header className="glass-panel border-0 border-b border-[var(--panel-border)] rounded-none sticky top-0 z-50 transition-colors duration-300" style={{ background: 'var(--header-bg)' }}>
          <div className="w-full px-5 sm:px-8 py-3 flex justify-between items-center gap-4 flex-wrap">
            <div className="flex items-center gap-4">
              <div className="bg-[#E3001B] p-3 rounded-xl shadow-[0_0_15px_rgba(227,0,27,0.4)]"><Icon name="box" size={24}/></div>
              <div>
                <p className="brand-mark text-2xl text-[var(--text-main)]">Agendamiento<span>/slotting.</span></p>
                <p className="text-[10px] text-[#009640] font-bold tracking-widest uppercase">Gestión corporativa</p>
              </div>
            </div>
            <div className="flex items-center gap-4 relative">
              <button onClick={handleRefresh} className="btn-white px-4 py-2 rounded-xl text-sm font-semibold flex items-center gap-2" title="Actualizar datos"><Icon name="refresh" size={16}/> Actualizar</button>
              
              <div className="relative">
                <button onClick={() => setShowThemeMenu(!showThemeMenu)} className="btn-white px-4 py-2 rounded-xl text-sm font-semibold flex items-center gap-2">
                  <Icon name="palette" size={16}/> Tema
                </button>
                {showThemeMenu && (
                  <div className="absolute right-0 mt-2 w-32 glass-panel py-2 z-50 shadow-2xl border border-[var(--panel-border)]">
                    {['dark', 'light', 'gray'].map(t => (
                      <button key={t} onClick={() => { setTheme(t); setShowThemeMenu(false); }} className={`block w-full text-left px-4 py-2 text-sm font-semibold transition ${theme === t ? 'text-[#F37021]' : 'text-[var(--text-main)] hover:bg-[var(--card-hover)]'}`}>
                        {t === 'dark' ? 'Oscuro' : t === 'light' ? 'Blanco' : 'Gris'}
                      </button>
                    ))}
                  </div>
                )}
              </div>

              <div className="text-right hidden sm:block">
                <p className="text-sm font-bold text-[var(--text-main)]">Xiomara - Asistente Slotting</p>
                <span className="inline-block mt-1 text-[10px] font-bold text-[#F37021] bg-[#F37021]/10 px-2 py-0.5 rounded tracking-wide uppercase">Rol: {role}</span>
              </div>
              <button onClick={logout} title="Cerrar sesión" className="p-2.5 bg-[var(--card-hover)] border border-[var(--panel-border)] rounded-xl hover:bg-[#E3001B]/20 hover:border-[#E3001B]/30 text-[var(--text-muted)] hover:text-[#E3001B] transition"><Icon name="logout" size={20}/></button>
            </div>
          </div>
        </header>

        <div className="w-full lg:flex min-h-[calc(100vh-85px)]">
          {/* SIDEBAR */}
          <aside className="app-sidebar lg:w-64 shrink-0 p-4 lg:p-5 z-40 transition-all">
            <p className="hidden lg:block text-[10px] font-bold tracking-widest text-[var(--text-muted)] px-3 mt-3 mb-5 uppercase">Menú Principal</p>
            <nav className="flex lg:flex-col gap-1.5 overflow-x-auto pb-2 lg:pb-0 scrollbar-hide">
              {Object.entries(VIEWS).map(([key, item]) =>
                <button key={key} onClick={() => navigate(key)} className={`nav-link flex items-center gap-3 px-4 py-3 text-sm text-left font-semibold shrink-0 lg:shrink ${view === key ? "active" : ""}`}>
                  <span className="shrink-0"><Icon name={item.icon}/></span>
                  {item.title}
                </button>
              )}
            </nav>
          </aside>

          {/* MAIN CONTENT */}
          <main className="flex-1 min-w-0 p-4 sm:p-6 lg:p-8 space-y-6">
            <div className="flex justify-between gap-4 items-start flex-wrap">
              <div>
                <p className="text-xs text-[#F37021] font-bold mb-1 uppercase tracking-widest">Operaciones / {VIEWS[view].title}</p>
                <h1 className="text-3xl sm:text-4xl font-black tracking-tight text-[var(--text-main)]">{VIEWS[view].title}</h1>
                <p className="text-sm text-[var(--text-muted)] mt-1">{VIEWS[view].subtitle}</p>
              </div>
              <span className="glass-panel px-3 py-1.5 text-xs font-bold text-[var(--text-muted)] tracking-wider">{formatDate(currentDay)}</span>
            </div>

            {storageError && <div className="p-4 rounded-xl bg-[#E3001B]/10 border border-[#E3001B]/20 text-[#E3001B] text-sm font-bold">{storageError}</div>}
            {notice && <div className="p-4 rounded-xl bg-blue-500/10 border border-blue-500/20 text-blue-500 text-sm font-bold flex justify-between items-center shadow-[0_0_15px_rgba(59,130,246,0.1)]">
              {notice} <button onClick={() => setNotice("")} className="text-xl hover:text-blue-700 transition">×</button>
            </div>}

            {/* VISTA ESPECIAL: DASHBOARD DE CITAS */}
            {view === "resumen" ? (
              <ExecutiveSummary summary={executiveSummary} />
            ) : view === "catalogo" ? (
              <CatalogoView
                catalog={catalog}
                onUpload={handleCatalogUpload}
                onClear={handleCatalogClear}
                onExport={handleCatalogExport}
                isAdmin={isAdmin}
              />
            ) : view === "dashboardCitas" ? (
              <CitasDashboard 
                data={dashboardData} 
                onUpload={handleDashboardUpload} 
                history={dashboardHistory}
                onSaveHistory={handleSaveHistory}
                onLoadHistory={handleLoadHistory}
                onDeleteHistory={handleDeleteHistory}
              />
            ) : view === "citas" ? (
              <CitasAnalytics dashboardHistory={dashboardHistory} />
            ) : (
              <>
                {importReport && <div className="glass-panel p-4 text-sm">
                  <p className="font-bold text-[#009640]">Carga finalizada: {importReport.added} importados.</p>
                  {importReport.errors.length > 0 && <ul className="mt-2 text-xs text-[#E3001B] list-disc pl-4">{importReport.errors.map((e,i) => <li key={i}>{e}</li>)}</ul>}
                </div>}

                <section className="glass-panel overflow-hidden border-t-4 border-t-[#E3001B]">
                  <div className="p-4 sm:p-6">
                    <div className="flex justify-between items-center mb-4">
                      <div>
                        <h2 className="text-xl font-bold text-[var(--text-main)]">Indicadores de Rendimiento</h2>
                        <p className="text-sm text-[var(--text-muted)] mt-1">Resumen visual del estado actual</p>
                      </div>
                    </div>
                    <div className="grid sm:grid-cols-3 gap-4">
                      {kpis.map(kpi => <GaugeCard key={kpi.label} {...kpi} max={maxKpi} />)}
                    </div>
                  </div>
                </section>

                {/* DASHBOARD PARA MASTER PACK */}
                {isPack && (
                  <>
                    <div className="flex justify-between items-center glass-panel p-4 flex-wrap gap-4 mb-2 mt-6">
                      <div>
                        <h2 className="text-lg font-bold text-[var(--text-main)] tracking-wide">
                          CAMBIOS DEL {packDateFilter ? formatDate(packDateFilter) : "HISTÓRICO"}
                        </h2>
                      </div>
                      <div className="flex gap-3 items-center">
                        <label className="text-xs font-bold text-[var(--text-muted)] uppercase tracking-wider">Filtrar por fecha:</label>
                        <input type="date" className="field w-auto text-sm" value={packDateFilter} onChange={e => setPackDateFilter(e.target.value)} />
                        {packDateFilter && <button onClick={() => setPackDateFilter("")} className="btn-white px-3 py-1.5 text-xs font-bold">Ver Todo</button>}
                      </div>
                    </div>
                    <MasterPackDashboard data={packDateFilter ? rows.filter(r => r.date === packDateFilter) : rows} />
                  </>
                )}

                <section className="glass-panel overflow-hidden">
                  <div className="p-4 sm:p-5 border-b border-[var(--panel-border)] space-y-4 bg-[var(--table-head-bg)]">
                    <div className="flex justify-between items-center gap-4 flex-wrap">
                      <div>
                        <h2 className="text-lg font-bold text-[var(--text-main)]">{isPack ? "Historial de cambios" : "Listado de registros"}</h2>
                        <p className="text-xs text-[var(--text-muted)] mt-1">{visibleRows.length} de {rows.length} registros</p>
                      </div>
                      <div className="flex gap-2 flex-wrap">
                        {isPack && <>
                          <button onClick={downloadTemplate} className="btn-white rounded-xl px-3 py-2 text-sm font-semibold flex items-center gap-2"><Icon name="download" size={16}/> Plantilla</button>
                          <button onClick={() => fileRef.current?.click()} className="btn-white rounded-xl px-3 py-2 text-sm font-semibold flex items-center gap-2"><Icon name="upload" size={16}/> Cargar Excel</button>
                          <input ref={fileRef} type="file" accept=".xlsx,.xls,.csv" className="hidden" onChange={importFile}/>
                        </>}
                        <button onClick={exportExcel} disabled={!visibleRows.length} className="btn-white rounded-xl px-3 py-2 text-sm font-semibold flex items-center gap-2"><Icon name="download" size={16}/> Exportar</button>
                        <button onClick={() => setModal({ view })} className="btn-primary rounded-xl px-4 py-2 text-sm font-bold flex items-center gap-2"><Icon name="plus" size={16}/> {isPack ? "Nuevo Cambio" : isCitas ? "Nuevo Reporte" : "Nueva Incidencia"}</button>
                      </div>
                    </div>

                    <div className="flex gap-3 flex-wrap items-end">
                      <div className="relative w-full sm:max-w-xs">
                        <span className="absolute left-3 top-2.5 text-[var(--text-muted)]"><Icon name="search" size={16}/></span>
                        <input className="field pl-9" placeholder="Buscar..." value={search} onChange={e => setSearch(e.target.value)}/>
                      </div>
                      <label className="text-xs font-bold text-[var(--text-muted)] uppercase tracking-wider flex items-center gap-2">Desde <input type="date" className="field w-auto" value={dateFrom} onChange={e => setDateFrom(e.target.value)}/></label>
                      <label className="text-xs font-bold text-[var(--text-muted)] uppercase tracking-wider flex items-center gap-2">Hasta <input type="date" className="field w-auto" value={dateTo} onChange={e => setDateTo(e.target.value)}/></label>
                      {!isPack && <select className="field w-full sm:w-auto" value={filter} onChange={e => setFilter(e.target.value)}><option value="">Todos los estados</option>{STATES.map(s => <option key={s}>{s}</option>)}</select>}
                      {isPack && <select className="field w-full sm:w-auto" value={userFilter} onChange={e => setUserFilter(e.target.value)}><option value="">Todos los usuarios</option>{packUsers.map(u => <option key={u}>{u}</option>)}</select>}
                      {isPack && <select className="field w-full sm:w-auto" value={proceededFilter} onChange={e => setProceededFilter(e.target.value)}><option value="">Procedió: todos</option><option value="Sí">Sí</option><option value="No">No</option></select>}
                      
                      {(search || filter || dateFrom || dateTo || userFilter || proceededFilter) && (
                        <button onClick={clearFilters} className="bg-[#F37021]/10 hover:bg-[#F37021]/20 border border-[#F37021]/30 text-[#F37021] px-3 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2">
                          <Icon name="refresh" size={14}/> Limpiar Filtros
                        </button>
                      )}
                    </div>

                    {isAdmin && selectedIds.length > 0 && (
                      <div className="flex items-center justify-between gap-4 bg-[#E3001B]/10 border border-[#E3001B]/20 rounded-xl px-4 py-2.5 text-sm flex-wrap">
                        <p className="font-bold text-[#E3001B] tracking-wide">{selectedIds.length} SELECCIONADO(S)</p>
                        <div className="flex gap-2">
                          <button onClick={() => setSelectedIds([])} className="px-3 py-1.5 border border-[var(--panel-border)] rounded-lg bg-[var(--card-hover)] hover:bg-[var(--input-bg)] text-xs font-semibold text-[var(--text-muted)] transition">Limpiar Selección</button>
                          <button onClick={deleteSelected} className="bg-[#E3001B] hover:bg-[#ff0022] px-3 py-1.5 rounded-lg text-xs font-bold text-white flex items-center gap-1 shadow-[0_0_10px_rgba(227,0,27,0.4)] transition"><Icon name="trash" size={14}/> Eliminar</button>
                        </div>
                      </div>
                    )}
                  </div>

                  <div className="overflow-x-auto">
                    <table className="w-full">
                      <thead>
                        <tr>
                          {isAdmin && <th scope="col" className="w-10"><input ref={headerCheckRef} type="checkbox" className="check" checked={allVisibleSelected} onChange={toggleAllVisible}/></th>}
                          {isPack ? ["SKU","Descripción","MP Antiguo","MP Nuevo","Fecha","Usuario","Procedió","Estado"].map(h => <th scope="col" key={h}>{h}</th>)
                           : isCitas ? ["Fecha Rep.","Proveedor","Fecha Cita","Tipo","Descripción","Estado","Tiempo"].map(h => <th scope="col" key={h}>{h}</th>)
                           : view === "master" ? ["Fecha","SKU","Descripción","Motivo","Estado","Tiempo"].map(h => <th scope="col" key={h}>{h}</th>)
                           : ["Fecha","Proveedor","Motivo","Observaciones","Estado","Tiempo"].map(h => <th scope="col" key={h}>{h}</th>)}
                          {isAdmin && <th scope="col">Acciones</th>}
                        </tr>
                      </thead>
                      <tbody>
                        {visibleRows.map(row => {
                          const isCritical = view === "suppliers" && row.status !== "Resuelta" && elapsedDays(row, now) >= 1;
                          return <tr key={row.id}>
                            {isAdmin && <td><input type="checkbox" className="check" checked={selectedIds.includes(row.id)} onChange={() => toggleRow(row.id)}/></td>}
                            {isPack ? <>
                              <td className="font-bold text-[var(--text-main)]">{row.sku}</td>
                              <td className="min-w-[200px] text-[var(--text-dark)]">{row.description}</td>
                              <td className="text-[var(--text-muted)]">{row.oldMP}</td>
                              <td><span className="bg-[#F37021]/10 border border-[#F37021]/20 text-[#F37021] px-2.5 py-1 rounded-lg font-bold text-xs">{row.newMP}</span></td>
                              <td className="whitespace-nowrap text-[var(--text-muted)]">{formatDate(row.date)}</td>
                              <td className="text-[var(--text-dark)]">{row.user}</td>
                              <td><span className={`px-2.5 py-1 rounded-full text-[10px] font-bold tracking-wide ${row.proceeded === 'Sí' ? 'bg-[#009640]/10 text-[#009640] border border-[#009640]/20' : 'bg-[#E3001B]/10 text-[#E3001B] border border-[#E3001B]/20'}`}>{row.proceeded.toUpperCase()}</span></td>
                              <td><Badge status={row.status || "Pendiente"}/></td>
                            </> : isCitas ? <>
                              <td className="text-sm text-[var(--text-muted)]">{formatDate(row.createdAt)}</td>
                              <td className="font-semibold text-[var(--text-main)]">{row.supplier}</td>
                              <td className="text-sm text-[var(--text-muted)]">{formatDate(row.appointmentDate)}</td>
                              <td><span className="bg-[var(--card-hover)] border border-[var(--panel-border)] text-[var(--text-dark)] px-2 py-1 rounded text-xs font-bold">{row.reportType}</span></td>
                              <td className="min-w-[200px] text-[var(--text-dark)]">{row.description}</td>
                              <td><Badge status={row.status}/></td>
                              <td className="whitespace-nowrap text-sm text-[var(--text-muted)]">{elapsedText(row, now)}</td>
                            </> : view === "master" ? <>
                              <td className="text-sm text-[var(--text-muted)]">{formatDate(row.createdAt)}</td>
                              <td className="font-bold text-[var(--text-main)]">{row.sku}</td>
                              <td className="min-w-[200px] text-[var(--text-dark)]">{row.description}</td>
                              <td className="min-w-[180px] text-[var(--text-dark)]">{row.reason}</td>
                              <td><Badge status={row.status}/></td>
                              <td className="whitespace-nowrap"><p className={isCritical ? "text-[#E3001B] font-bold" : "text-[var(--text-muted)]"}>{elapsedText(row, now)}</p><p className="text-[10px] text-[var(--text-muted)] mt-1">{row.status === "Resuelta" ? "Hasta resolución" : isCritical ? "Atención crítica" : "Transcurrido"}</p></td>
                            </> : <>
                              <td className="text-sm text-[var(--text-muted)]">{formatDate(row.createdAt)}</td>
                              <td className="font-semibold text-[var(--text-main)]">{row.supplier}</td>
                              <td className="min-w-[150px] text-[var(--text-dark)]">{row.reason}</td>
                              <td className="min-w-[180px] text-[var(--text-muted)] italic">{row.observations || "—"}</td>
                              <td><Badge status={row.status}/></td>
                              <td className="whitespace-nowrap"><p className={isCritical ? "text-[#E3001B] font-bold" : "text-[var(--text-muted)]"}>{elapsedText(row, now)}</p><p className="text-[10px] text-[var(--text-muted)] mt-1">{row.status === "Resuelta" ? "Hasta resolución" : isCritical ? "Atención crítica" : "Transcurrido"}</p></td>
                            </>}
                            {isAdmin && <td>{rowActions(row)}</td>}
                          </tr>;
                        })}
                        {!visibleRows.length && <tr><td colSpan={isAdmin ? 10 : 9} className="text-center text-[var(--text-muted)] py-12">No se encontraron registros.</td></tr>}
                      </tbody>
                    </table>
                  </div>
                  <div className="border-t border-[var(--table-border)] px-6 py-4 text-xs text-[var(--text-muted)] bg-[var(--table-head-bg)] font-medium">
                    {isPack ? "Use las casillas para seleccionar registros y eliminarlos en bloque." : "Los indicadores consideran todos los registros de esta sección."}
                  </div>
                </section>
              </>
            )}
            <footer className="text-xs text-[var(--text-muted)] font-medium py-4 text-center">Agendamiento/slotting · Gestión y seguimiento operativo</footer>
          </main>
        </div>

        {modal && <RecordModal modal={modal} onClose={() => setModal(null)} onSave={saveRecord} catalog={catalog}/>}
      </div>;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
